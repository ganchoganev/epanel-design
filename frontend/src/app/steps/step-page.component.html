<app-bar [title]="page().title" />
<div class="page">
  <p class="kicker">{{ page().track }} · {{ page().step }}</p>
  <h1>{{ page().title }}</h1>
  <p class="lead">{{ page().lead }}</p>
  <ul>
    @for (point of page().points; track point) {
      <li>{{ point }}</li>
    }
  </ul>
  <p class="note">{{ page().note }}</p>
</div>
